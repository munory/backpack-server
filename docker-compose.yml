# Local development services: the database and a fake mail inbox.
# `npm run db:up` starts them, `npm run db:down` stops them; the database's
# data survives both (it lives in the `pgdata` volume).
# Credentials come from .env — see .env.example.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # 127.0.0.1: reachable from this computer only, not from the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches every email the server sends — nothing ever reaches a real
  # inbox. Read them at http://localhost:8025. In production the server
  # talks to a real mail service instead (SMTP_URL in .env).
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025" # SMTP — where the server sends mail
      - "127.0.0.1:8025:8025" # web inbox

volumes:
  pgdata:
